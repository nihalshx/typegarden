<!doctype html>
<!--
  Type Garden by Nihal.
  Based on Type Garden (type-garden.vercel.app) by Akshat Agarwal.
  As you type, stems and roses grow out of the letters. Space cuts the stems so the next word
  grows a new garden, backspace withers, enter clears.
  One file, canvas + plain JavaScript, no build step.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>Type Garden · Nihal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,700&family=Bricolage+Grotesque:wght@700&family=Dancing+Script:wght@700&family=Unbounded:wght@700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
a{color:#fff} a:hover{color:#FFB4A8}
[hidden]{display:none!important}
[data-tg="app"]{position:fixed;inset:0;cursor:text;font-family:'DM Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
[data-tg="app"] button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html[data-touch] [data-tg="app"]{touch-action:none;top:var(--tg-top,0px)!important;bottom:auto!important;height:var(--tg-h,100%)!important}

#cv{position:absolute;inset:0;width:100%;height:100%}
[data-tg="input"]{position:fixed;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;pointer-events:none}

[data-tg="modes"]{position:absolute;z-index:5;display:flex;gap:4px;padding:4px;border:1px solid #2A2A2A;border-radius:999px;background:#000;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right))}
.mode{border:0;border-radius:999px;padding:7px 14px;font:inherit;font-size:12px;letter-spacing:0.04em;cursor:pointer}

[data-tg="bar"]{position:absolute;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:12px;letter-spacing:0.04em;opacity:0.6;left:calc(24px + env(safe-area-inset-left));right:calc(24px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom))}
[data-tg="hints"]{display:flex;gap:20px;flex-wrap:wrap}
[data-tg="ctrls"]{display:flex;gap:8px;align-items:center}
[data-tg="pal"]{display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid #3A3A3A;border-radius:999px}
[data-tg="sw"]{width:22px;height:22px;padding:0;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s}
[data-tg="sw"]:hover{transform:scale(1.15)!important}
[data-tg="dot"]{width:10px;height:10px;border-radius:999px}
[data-tg="btn"]{background:transparent;border:1px solid #3A3A3A;color:#BDBDBD;font:inherit;padding:8px 14px;border-radius:999px;cursor:pointer}
[data-tg="btn"]:hover{border-color:#FFFFFF;color:#FFFFFF}
[data-tg="coarse"]{display:none}
@media (pointer:coarse){[data-tg="fine"]{display:none}[data-tg="coarse"]{display:inline}}

[data-tg="poster"]{position:absolute;inset:0;display:grid;grid-template-columns:minmax(280px,340px) minmax(0,1fr);background:#000;cursor:default;color:#EDEDED;font-size:12px;letter-spacing:0.03em}
[data-tg="panel"]{border-right:1px solid #1E1E1E;overflow-y:auto;overflow-x:hidden;padding:24px 22px 32px;display:flex;flex-direction:column;gap:26px;background:#0A0A0A}
.sec{display:flex;flex-direction:column;gap:10px}
.lbl{color:#8C8C8C;text-transform:uppercase;font-size:11px;letter-spacing:0.08em}
.serif{font-family:var(--tg-font,'Playfair Display',Georgia,serif);font-weight:var(--tg-fw,700);font-style:var(--tg-fst,normal)}
[data-tg="credit"]{position:absolute;top:calc(22px + env(safe-area-inset-top));left:calc(24px + env(safe-area-inset-left));font-size:12px;letter-spacing:0.04em;opacity:0.6;pointer-events:none}
[data-tg="gpanel"]{position:absolute;z-index:6;right:calc(24px + env(safe-area-inset-right));bottom:72px;width:min(360px,calc(100vw - 32px));max-height:calc(100% - 150px);overflow-y:auto;overflow-x:hidden;box-sizing:border-box;background:#0A0A0A;border:1px solid #2A2A2A;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:18px;color:#EDEDED;font-size:12px;letter-spacing:0.03em;cursor:default;touch-action:pan-y}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #2A2A2A;background:transparent;color:#EDEDED;border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;cursor:pointer}
.chip:hover{border-color:#8C8C8C}
.chip[aria-pressed="true"]{background:#FFFFFF;color:#000000;border-color:#FFFFFF}
.swgrid{display:grid;grid-template-columns:repeat(10,22px);justify-content:space-between;row-gap:8px}
.srow{display:grid;grid-template-columns:62px minmax(0,1fr) 40px;align-items:center;gap:10px;color:#BDBDBD}
.srow input{width:100%;accent-color:#FFFFFF;margin:0}
.srow .sval{text-align:right;color:#8C8C8C}
#gbtn{display:inline-flex;align-items:center;gap:7px}
#gbtn .gdot{width:9px;height:9px;border-radius:50%}
#gbtn[aria-expanded="true"]{background:#0A0A0A;border-color:#0A0A0A;color:#FFFFFF}
#ptext{background:#000;border:1px solid #2A2A2A;border-radius:10px;color:#FFFFFF;font-size:22px;padding:10px 12px;outline:none;-webkit-user-select:text;user-select:text}
#ptext:focus{border-color:#FFFFFF}
.ghost{background:transparent;border:1px solid #2A2A2A;color:#EDEDED;font:inherit;padding:8px 12px;border-radius:999px;cursor:pointer}
.ghost:hover{border-color:#FFFFFF}
.preset{text-align:left;color:#FFFFFF;font:inherit;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;border:1px solid #2A2A2A;background:transparent}
.pcard{display:flex;flex-direction:column;gap:8px;align-items:stretch;background:transparent;color:#EDEDED;font:inherit;padding:6px 6px 8px;border-radius:12px;cursor:pointer;text-align:left;border:1px solid #2A2A2A}
.pcard:hover{border-color:#8C8C8C!important}
#vbtn{background:#FFFFFF;border:0;color:#000;font:inherit;font-weight:500;padding:12px 14px;border-radius:999px;cursor:pointer}
#fbtn{background:transparent;border:1px solid #3A3A3A;color:#EDEDED;font:inherit;padding:11px 14px;border-radius:999px;cursor:pointer}
#fbtn:hover{border-color:#FFFFFF}
button:disabled{opacity:.5;cursor:default}
[data-tg="stage"]{display:flex;align-items:center;justify-content:center;padding:56px 32px 32px;min-width:0}
[data-tg="pcanvas"]{width:min(100%, calc(100vh - 96px));height:auto;aspect-ratio:1 / 1;display:block;border:1px solid #1E1E1E}

@media (max-width:600px){
  [data-tg="bar"]{left:calc(16px + env(safe-area-inset-left));right:calc(16px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));gap:10px}
  [data-tg="hints"]{gap:12px;font-size:11px}
  [data-tg="ctrls"]{flex:1 1 100%;justify-content:space-between;gap:8px}
  [data-tg="pal"]{gap:4px}
  [data-tg="sw"]{--sw:clamp(13px,calc((100vw - 183px) / 10),22px);width:var(--sw);height:var(--sw)}
  [data-tg="dot"]{width:calc(var(--sw) * .46);height:calc(var(--sw) * .46)}
  [data-tg="btn"]{padding:7px 11px}
  [data-tg="gpanel"]{left:calc(16px + env(safe-area-inset-left));right:calc(16px + env(safe-area-inset-right));width:auto}
  .swgrid{grid-template-columns:repeat(10,minmax(0,22px))}
  [data-tg="credit"]{left:calc(16px + env(safe-area-inset-left))}
}
@media (max-width:720px){
  [data-tg="poster"]{display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  [data-tg="poster"]::before{content:"";order:-2;position:sticky;top:0;flex:none;height:calc(60px + env(safe-area-inset-top));margin-bottom:calc(-60px - env(safe-area-inset-top));background:linear-gradient(#000 62%,rgba(0,0,0,0));z-index:4;pointer-events:none}
  [data-tg="stage"]{order:-1;flex:none;padding:calc(64px + env(safe-area-inset-top)) 16px 12px}
  [data-tg="pcanvas"]{width:100%;max-width:520px}
  [data-tg="panel"]{flex:none;border-right:0;border-top:1px solid #1E1E1E;overflow:visible;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div data-tg="app" id="app">
  <canvas id="cv"></canvas>
  <input id="inp" data-tg="input" aria-label="Type to grow a garden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">

  <div data-tg="credit" id="credit">Type Garden · by Nihal</div>
  <div data-tg="modes" id="modes"></div>

  <div data-tg="bar" id="bar">
    <div data-tg="hints">
      <span data-tg="fine">type to grow</span><span data-tg="coarse">tap to type</span>
      <span>space cuts</span>
      <span data-tg="fine">backspace withers</span><span data-tg="coarse">⌫ withers</span>
      <span data-tg="fine">enter clears</span><span data-tg="coarse">return clears</span>
    </div>
    <div data-tg="ctrls">
      <button data-tg="btn" id="gbtn" aria-expanded="false" aria-controls="gpanel"><span class="gdot" id="gdot"></span>Garden</button>
      <button data-tg="btn" id="png">PNG</button>
      <button data-tg="btn" id="svg">SVG</button>
    </div>
  </div>

  <div data-tg="gpanel" id="gpanel" hidden>
    <div class="sec"><div class="lbl">Flower</div><div class="chips" id="g-flower"></div></div>
    <div class="sec"><div class="lbl">Typeface</div><div class="chips" id="g-font"></div></div>
    <div class="sec"><div class="lbl">Palette · <span id="g-palname" style="text-transform:none"></span></div><div class="swgrid" id="g-pal"></div></div>
    <div class="sec"><div class="lbl">Motion</div><div class="sec" id="g-motion"></div></div>
    <div class="sec"><div class="lbl">In the air</div><div class="chips" id="g-weather"></div></div>
  </div>

  <div data-tg="poster" id="poster" hidden>
    <div data-tg="panel">
      <div style="display:flex;flex-direction:column;gap:4px">
        <div class="serif" style="font-size:26px;letter-spacing:0;color:#FFFFFF">Poster</div>
        <div id="info" style="color:#8C8C8C"></div>
        <div style="color:#8C8C8C">Type Garden by Nihal</div>
      </div>
      <div class="sec">
        <div class="lbl">Words</div>
        <input id="ptext" class="serif" spellcheck="false">
        <button id="regrow" class="ghost" style="align-self:flex-start">Regrow garden</button>
      </div>
      <div class="sec">
        <div class="lbl">Flower</div>
        <div class="chips" id="p-flower"></div>
      </div>
      <div class="sec">
        <div class="lbl">Typeface</div>
        <div class="chips" id="p-font"></div>
      </div>
      <div class="sec">
        <div class="lbl">Motion</div>
        <div id="presets" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
        <div id="p-motion"></div>
      </div>
      <div class="sec">
        <div class="lbl">Palette</div>
        <div id="pcards" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px"></div>
      </div>
      <div class="sec" style="border-top:1px solid #1E1E1E;padding-top:20px">
        <div class="lbl">Export · 1080 × 1080 loop</div>
        <button id="vbtn"></button>
        <button id="fbtn">PNG frames (.zip)</button>
        <div id="status" style="color:#8C8C8C;min-height:16px"></div>
      </div>
    </div>
    <div data-tg="stage">
      <canvas id="pcv" data-tg="pcanvas" width="1080" height="1080"></canvas>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

class TypeGarden {
  cv = { current: $('cv') };
  inp = { current: $('inp') };
  pcv = { current: $('pcv') };
  props = { recoil: 20, density: 1, showHint: true };
  SENT = String.fromCharCode(0x200b); // kept in the hidden field so Backspace on an empty field still reports
  FONTS = [
    { id: 'serif', label: 'Serif', family: '"Playfair Display",Georgia,serif', w: 700, st: 'normal', gf: 'Playfair+Display:wght@700' },
    { id: 'italic', label: 'Italic', family: '"Playfair Display",Georgia,serif', w: 700, st: 'italic', gf: 'Playfair+Display:ital,wght@1,700' },
    { id: 'sans', label: 'Sans', family: '"Bricolage Grotesque",system-ui,sans-serif', w: 700, st: 'normal', gf: 'Bricolage+Grotesque:wght@700' },
    { id: 'script', label: 'Script', family: '"Dancing Script",cursive', w: 700, st: 'normal', gf: 'Dancing+Script:wght@700' },
    { id: 'wide', label: 'Wide', family: '"Unbounded",system-ui,sans-serif', w: 700, st: 'normal', gf: 'Unbounded:wght@700' },
    { id: 'mono', label: 'Mono', family: '"Space Mono",ui-monospace,monospace', w: 700, st: 'normal', gf: 'Space+Mono:wght@700' }
  ];
  KINDS = ['rose', 'tulip', 'daisy', 'poppy', 'blossom', 'wild'];
  FLOWERS = [['rose', 'Rose'], ['tulip', 'Tulip'], ['daisy', 'Daisy'], ['poppy', 'Poppy'], ['blossom', 'Cherry blossom'], ['wild', 'Wildflower'], ['mix', 'Mix']];
  WEATHER = [['none', 'Nothing'], ['petals', 'Falling petals'], ['pollen', 'Pollen'], ['both', 'Both']];
  C = { red: '#FF1400', blue: '#3257FF', line: '#FFB4A8', text: '#FFFFFF', vein: '#000000' };
  PRESETS = [
    { id: 'breathe', label: 'Breathe', sub: 'Slow sway · 3s', T: 3000 },
    { id: 'grow', label: 'Grow & wither', sub: 'Bloom, then back · 6s', T: 6000 },
    { id: 'typed', label: 'Typed', sub: 'Type, cut, repeat · 5s', T: 5000 },
    { id: 'wind', label: 'Gust', sub: 'Wind sweeps through · 4s', T: 4000 },
    { id: 'reach', label: 'Reach', sub: 'Stems follow a light · 6s', T: 6000 },
    { id: 'scatter', label: 'Scatter', sub: 'Random bloom, fade · 6s', T: 6000 },
    { id: 'visit', label: 'Visitor', sub: 'Butterfly drops by · 7s', T: 7000 },
    { id: 'fall', label: 'Petal fall', sub: 'Petals drift down · 6s', T: 6000 },
    { id: 'pollen', label: 'Pollen', sub: 'Motes float up · 5s', T: 5000 },
    { id: 'pulse', label: 'Pulse', sub: 'Blooms beat in a wave · 4s', T: 4000 }
  ];
  // name, background, flower, stem & leaf, flower line, type
  PAL = [
    ['Rose noir', '#000000', '#FF1400', '#3257FF', '#FFB4A8', '#FFFFFF'],
    ['Paper', '#F3EEE4', '#FF3B1F', '#1C2B8F', '#FFD2C4', '#111111'],
    ['Midnight', '#0D1B4C', '#FF5A4E', '#9FB4FF', '#FFD6CF', '#FFFFFF'],
    ['Citrus', '#0E1A12', '#FF8A00', '#1FA463', '#FFE2B8', '#FFF6E8'],
    ['Orchid', '#140A1F', '#E63CFF', '#2FB8A6', '#F9D1FF', '#FFFFFF'],
    ['Moss', '#133A2A', '#FFB7C5', '#7FD18B', '#FFFFFF', '#F6F1E7'],
    ['Tomato', '#FF1400', '#FFF1E0', '#0B0B0B', '#FF1400', '#000000'],
    ['Butter', '#FFE9A8', '#E4002B', '#0F5132', '#FFC2C2', '#1A1A1A'],
    ['Blush', '#FAD4D8', '#C8102E', '#274690', '#FFE3E6', '#1A1A1A'],
    ['Mono', '#000000', '#F2F2F2', '#6E6E6E', '#000000', '#FFFFFF'],
    ['Sakura', '#FFF1F3', '#F48FB1', '#6B4F3A', '#FFFFFF', '#3B2A33'],
    ['Ocean', '#06283D', '#FFB703', '#47B5FF', '#FB8500', '#E8F6FF'],
    ['Lavender', '#ECE7F8', '#7B5CD6', '#2F6B4F', '#D9CCFF', '#1F1535'],
    ['Sunset', '#2B0F3A', '#FF6B35', '#F7C548', '#FFD3B8', '#FFF1E6'],
    ['Forest', '#0B2318', '#F2EBD3', '#4F9D69', '#C2A65A', '#F2EFE3'],
    ['Ink', '#FFFFFF', '#111111', '#111111', '#FFFFFF', '#111111'],
    ['Neon', '#0A0A0A', '#FF2D95', '#00F5D4', '#FFE600', '#F5F5F5'],
    ['Terracotta', '#F4E3D3', '#C4512D', '#3F5E3A', '#F6C7A8', '#2B1A12'],
    ['Sky', '#CFE8FF', '#FF4F79', '#1D4ED8', '#FFD1DC', '#0B1B3A'],
    ['Gold', '#121212', '#E9B949', '#7C8A5A', '#6B4400', '#F5E9C8']
  ];
  state = { mode: 'type', preset: 'breathe', palette: 0, text: 'in bloom', seed: 7, status: '', busy: false,
    flower: 'rose', font: 'serif', grow: 1, shake: 1, weather: 'none', open: false };
  SAVED = ['palette', 'flower', 'font', 'grow', 'shake', 'weather', 'preset'];

  setState(patch, cb) {
    Object.assign(this.state, patch);
    if (this.SAVED.some(k => k in patch)) {
      const o = {}; for (const k of this.SAVED) o[k] = this.state[k];
      try { localStorage.setItem('tg-garden', JSON.stringify(o)); } catch (e) {}
    }
    this.ui(); if (cb) cb();
  }
  restore() {
    let o = null; try { o = JSON.parse(localStorage.getItem('tg-garden') || 'null'); } catch (e) {}
    if (!o) return;
    const s = this.state, num = (v, a, b) => typeof v === 'number' && v >= a && v <= b;
    if (Number.isInteger(o.palette) && this.PAL[o.palette]) s.palette = o.palette;
    if (this.FLOWERS.some(f => f[0] === o.flower)) s.flower = o.flower;
    if (this.FONTS.some(f => f.id === o.font)) s.font = o.font;
    if (this.WEATHER.some(w => w[0] === o.weather)) s.weather = o.weather;
    if (this.PRESETS.some(p => p.id === o.preset)) s.preset = o.preset;
    if (num(o.grow, 0.3, 3)) s.grow = o.grow;
    if (num(o.shake, 0, 3)) s.shake = o.shake;
  }
  face() { return this.FONTS.find(f => f.id === this.state.font) || this.FONTS[0]; }
  fnt(S) { const f = this.face(); return `${f.st} ${f.w} ${S}px ${f.family}`; }
  fontChanged() {
    this.cache = {}; this.layout(); this.buildPoster();
    if (document.fonts) document.fonts.load(this.fnt(100)).then(() => { this.cache = {}; this.layout(); this.buildPoster(); }).catch(() => {});
  }

  mount() {
    this.restore();
    this.buildUI();
    this.letters = []; this.uid = 1; this.cache = {}; this.Sd = 0; this.St = 0; this.wrapped = false;
    this.t0 = performance.now(); this.lastKey = 0; this.rand = Math.random;
    this.g = this.cv.current.getContext('2d');
    this.onResize = () => { this.resize(); this.placePanel(); };
    window.addEventListener('resize', this.onResize);
    this.resize();
    this.onKey = e => this.key(e);
    window.addEventListener('keydown', this.onKey);
    this.fa = {}; this.mx = null; this.flies = []; this.perch = []; this.parts = [];
    this.onMove = e => { this.mx = e.clientX; this.my = e.clientY; };
    this.onLeave = () => { this.mx = null; };
    window.addEventListener('pointermove', this.onMove);
    // ---------- phone ----------
    this.touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
    if (this.touch) document.documentElement.setAttribute('data-touch', '');
    this.ptype = 'mouse';
    this.onPD = e => { this.ptype = e.pointerType || 'mouse'; };
    window.addEventListener('pointerdown', this.onPD, true);
    this.onUp = e => { if (e.pointerType && e.pointerType !== 'mouse') this.mx = null; }; // roses relax when the finger lifts
    window.addEventListener('pointerup', this.onUp);
    window.addEventListener('pointercancel', this.onUp);
    const fld = this.inp.current;
    this.iv = this.SENT; if (fld) fld.value = this.SENT;
    this.onCS = () => { this.composing = true; };
    this.onCE = () => { this.composing = false; setTimeout(() => { const f = this.inp.current; if (f && !this.composing) this.inputDiff(f); }, 0); };
    if (fld) {
      fld.addEventListener('compositionstart', this.onCS); fld.addEventListener('compositionend', this.onCE);
      fld.addEventListener('input', e => this.inputDiff(e.target));
    }
    this.vv = window.visualViewport || null; this.vvMax = 0;
    this.onVV = () => this.syncVV();
    if (this.vv && this.touch) { this.vv.addEventListener('resize', this.onVV); this.vv.addEventListener('scroll', this.onVV); this.syncVV(); }
    if (/[?&]tgtest/.test(location.search)) window.__tg = this;
    document.addEventListener('pointerleave', this.onLeave);
    document.documentElement.addEventListener('mouseleave', this.onLeave);
    if (document.fonts) document.fonts.load(this.fnt(100)).then(() => { this.cache = {}; this.layout(); this.buildPoster(); }).catch(() => {});
    this.vmime = typeof MediaRecorder !== 'undefined' ? ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) : null;
    this.buildPoster();
    const loop = () => { this.raf = requestAnimationFrame(loop); this.frame(); };
    loop();
    if (!this.touch) setTimeout(() => this.inp.current && this.inp.current.focus({ preventScroll: true }), 50);
    this.ui();
  }

  // ---------- interface (plain DOM in place of the original template) ----------
  buildUI() {
    const app = $('app');
    app.addEventListener('pointerdown', ev => {
      if (this.state.mode !== 'type' || !this.inp.current) return;

  // ---------- export ----------
